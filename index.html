<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Greeting Module -->
    <header class="module-card" id="greeting-module">
      <div id="greeting-text">Good Morning</div>
      <div id="current-time">--:--:--</div>
      <div id="current-date">---</div>
    </header>

    <main class="dashboard-grid">
      <!-- Focus Timer Module -->
      <section class="module-card" id="timer-module" aria-label="Focus Timer">
        <h2>Focus Timer</h2>
        <div id="timer-display">25:00</div>
        <div id="timer-message" hidden>Session complete!</div>
        <div class="timer-controls">
          <button id="timer-start" type="button">Start</button>
          <button id="timer-stop" type="button">Stop</button>
          <button id="timer-reset" type="button">Reset</button>
        </div>
      </section>

      <!-- To-Do List Module -->
      <section class="module-card" id="todo-module" aria-label="To-Do List">
        <h2>To-Do List</h2>
        <div class="todo-add-form">
          <input
            type="text"
            id="todo-input"
            placeholder="Add a new task…"
            maxlength="200"
            aria-label="New task description"
          />
          <button id="todo-add-btn" type="button">Add</button>
        </div>
        <div id="todo-error" class="error-message" hidden></div>
        <ul id="todo-list" aria-label="Task list"></ul>
      </section>

      <!-- Quick Links Module -->
      <section class="module-card" id="ql-module" aria-label="Quick Links">
        <h2>Quick Links</h2>
        <div class="ql-add-form">
          <input
            type="text"
            id="ql-label-input"
            placeholder="Label"
            maxlength="50"
            aria-label="Link label"
          />
          <input
            type="url"
            id="ql-url-input"
            placeholder="https://example.com"
            maxlength="2048"
            aria-label="Link URL"
          />
          <button id="ql-add-btn" type="button">Add</button>
        </div>
        <div id="ql-error" class="error-message" hidden></div>
        <div id="ql-list" aria-label="Quick links list"></div>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
